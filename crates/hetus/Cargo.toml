[package]
name = "hetus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[features]
# ==================== 默认 features ====================
# 基础功能：UUID
default = ["common-default"]

# 基础依赖
common-default = ["hetu-common/with-uuid"]

# ==================== 功能模块 ====================

# Web 框架 (Axum)
web = ["dep:hetu-web", "dep:axum", "common-web"]
common-web = ["hetu-common/with-openapi", "hetu-web/with-openapi"]

# 数据库 (PostgreSQL + hetusql)
db = [
  "dep:hetu-db",
  "dep:sqlx",
  "dep:hetusql",
  "sqlx/postgres",
  "hetu-db/with-postgres",
  "hetusql/with-postgres",
  "hetusql/with-uuid",
  "hetu-common/with-db",
]
# SQLite 支持
db-sqlite = ["dep:sqlx", "dep:hetusql", "sqlx/sqlite", "hetusql/with-sqlite", "hetu-common/with-db"]

# 安全认证 (JWT)
security = ["dep:hetu-security", "hetu-security/with-jwt"]

# OAuth2 支持
oauth = ["security", "hetu-security/with-oauth"]

# AI 模块
ai = ["dep:hetu-ai", "common-ai"]
common-ai = ["hetu-common/with-ulid"]

# gRPC 支持
grpc = ["dep:hetu-grpc", "dep:tonic"]

# ULID 支持
ulid = ["dep:ulid", "utoipa/ulid", "hetu-common/with-ulid"]

# ==================== 可选功能 ====================

# OpenAPI 文档生成
openapi = [
  "dep:utoipa",
  "hetu-common/with-openapi",
  "hetu-core/with-openapi",
]

# 日志框架 (logforth)
logforth = ["dep:logforth", "hetu-core/with-logforth"]

# 分布式追踪 (tracing)
tracing = [
  "hetu-core/with-tracing",
]

# ==================== 便捷组合 ====================

# 完整功能
full = ["web", "db", "security", "ai", "grpc"]

# Web API (不含 AI)
api = ["web", "db", "security"]

# Web 服务
web-server = ["web", "db"]

# 微服务
microservice = ["web", "db", "security", "grpc"]

[dependencies]
hetu-common = { workspace = true }
hetu-core = { workspace = true }
hetu-core-macros = { workspace = true }
# -- security
hetu-security = { workspace = true, optional = true }
# -- db & hetusql
hetusql-core = { workspace = true, optional = true }
hetusql = { workspace = true, optional = true }
hetu-db = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# -- web & axum
axum = { workspace = true, optional = true }
hetu-web = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
# -- grpc & tonic
hetu-grpc = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
# -- ai
hetu-ai = { workspace = true, optional = true }
# -- misc
ulid = { workspace = true, optional = true }
rig-core = { workspace = true }
rmcp = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
inventory = { version = "0.3" }
logforth = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
