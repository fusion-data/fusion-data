[package]
name = "ultimate-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[features]
with-postgres = ["ultimatesql/with-postgres"]
with-sqlite = ["ultimatesql/with-sqlite"]
with-uuid = ["dep:uuid", "ultimatesql/with-uuid"]

[dependencies]
ultimate-common.workspace = true
ultimate-core = { workspace = true, features = ["ultimatesql"] }
ultimatesql = { workspace = true }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { workspace = true, optional = true }
config = { workspace = true }
sqlx.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
tonic = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
logforth.workspace = true
