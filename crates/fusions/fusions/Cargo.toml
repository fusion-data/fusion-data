[package]
name = "fusions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[features]
default = [
  "fusion-common/with-uuid",
  "utoipa/uuid",
  "sqlx/uuid",
]
with-db = [
  "dep:fusion-db",
  "dep:sqlx",
  "fusion-common/with-db",
  "sqlx/postgres",
  "fusion-db/with-postgres",
  "fusion-web/with-openapi",
]
with-grpc = ["dep:fusion-grpc", "dep:tonic"]
with-web = ["dep:fusion-web", "dep:axum"]
with-ulid = ["dep:ulid", "utoipa/ulid", "fusion-common/with-ulid"]
with-openapi = [
  "fusion-common/with-openapi",
  "fusion-core/with-openapi",
  "dep:utoipa",
]
with-ai = ["dep:fusion-ai"]
with-security = ["dep:fusion-security", "fusion-security/with-jwt"]
with-oauth = ["with-security", "fusion-security/with-oauth"]
with-logforth = ["fusion-core/with-logforth", "logforth"]
with-tracing = ["fusion-core/with-tracing"]

[dependencies]
fusion-common = { workspace = true }
fusion-core = { workspace = true }
fusion-core-macros = { workspace = true }
# -- security
fusion-security = { workspace = true, optional = true }
# -- db & fusionsql
fusionsql-core = { workspace = true, optional = true }
fusionsql = { workspace = true, optional = true }
fusion-db = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
# -- web & axum
axum = { workspace = true, optional = true }
fusion-web = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
# -- grpc & tonic
fusion-grpc = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
# -- ai
fusion-ai = { workspace = true, optional = true }
# -- misc
ulid = { workspace = true, optional = true }
rig-core = { workspace = true }
rmcp = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
inventory = { version = "0.3" }
logforth = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
dotenvy = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
