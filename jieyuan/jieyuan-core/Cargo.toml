[package]
name = "jieyuan-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = true

[lints]
workspace = true

[features]
with-openapi = [
  "dep:utoipa",
  "ultimates/with-openapi",
  "ultimatesql-core/with-openapi",
  "ultimatesql/with-openapi",
]
with-db = [
  "dep:sqlx",
  "dep:ultimatesql",
  "dep:sea-query",
]
with-web = [
  "with-openapi",
  "ultimates/with-web",
  "dep:axum",
  "dep:tower-http",
  "dep:http",
  "dep:futures",
  "dep:reqwest",
  "dep:headers",
]

[dependencies]
ultimates = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = { workspace = true }
strum = { workspace = true }
utoipa = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sea-query = { workspace = true, optional = true }
ultimatesql = { workspace = true, optional = true }
ultimatesql-core = { workspace = true }
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
log = { workspace = true }
http = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
headers = { workspace = true, optional = true }
chrono = { workspace = true }
semver = { workspace = true }
