[ultimate.app]
run_mode = "DEV"
name = "ultimate-iam"

[ultimate.security.pwd]
expires_in = 604800
default_pwd = "2025.Ultimate"

[ultimate.web]
enable = true
server_addr = "0.0.0.0:58000"

[ultimate.log]
enable = true
log_writers = ["stdout", "file"]
with_span_events = []
log_targets = [
  "ultimate_db=debug",
  "ultimate_common=debug",
  "ultimate_web=debug",
  "jieyuan=debug",
]

[ultimate.log.otel]
# enable = true
exporter_otlp_endpoint = "http://localhost:4317"
traces_sample = "always_on"

[ultimate.db]
enable = true
url = "postgres://fusiondata:2025.Fusiondata@localhost:5432/fusiondata"

[jieyuan.auth_provider.wechat]
client_id = ""
client_secret = ""
authorize_url = ""
redirect_uri = ""
token_url = ""
user_info_url = ""
scope = ""
